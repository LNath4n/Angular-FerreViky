<mat-sidenav-container class="sidenav-container">

  <!-- Sidenav solo en mobile -->
  <mat-sidenav #drawer class="sidenav" fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="'over'" [opened]="false">
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/productos" (click)="drawer.close()">Productos</a>
      <a mat-list-item routerLink="/grupos" (click)="drawer.close()">Grupo de Productos</a>

      @if (userId()) {
        <a mat-list-item routerLink="/perfil" (click)="drawer.close()">
          <mat-icon>account_circle</mat-icon> Mi perfil
        </a>
        <a mat-list-item (click)="logout(); drawer.close()">
          <mat-icon>logout</mat-icon> Cerrar sesión
        </a>
      } @else {
        <a mat-list-item routerLink="/login" (click)="drawer.close()">Login</a>
        <a mat-list-item routerLink="/registro" (click)="drawer.close()">Registro</a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>

    @if (isHandset$ | async) {
    <mat-toolbar color="primary">
      <button matIconButton (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>FerreViky</span>
    </mat-toolbar>
    }

    @if (!(isHandset$ | async)) {
    <mat-toolbar color="primary">
      <span>FerreViky</span>
      <span class="spacer"></span>
      <a mat-button routerLink="/productos">Productos</a>
      <a mat-button routerLink="/grupos">Grupo de Productos</a>

      @if (userId()) {
        <a mat-button routerLink="/perfil">
          <mat-icon>account_circle</mat-icon>
        </a>
        <button mat-icon-button (click)="logout()" matTooltip="Cerrar sesión">
          <mat-icon>logout</mat-icon>
        </button>
      } @else {
        <a mat-button routerLink="/login">Login</a>
        <a mat-button routerLink="/registro">Registro</a>
      }
    </mat-toolbar>
    }

    <router-outlet />

  </mat-sidenav-content>
</mat-sidenav-container>
