<div class="toast-container-furni" aria-live="polite">
  @for (a of alertas(); track a.id) {
  <div class="toast-furni" [attr.data-tipo]="a.tipo" role="alert">

    <div class="toast-icono">
      @switch (a.tipo) {
        @case ('exito') { <svg lucideCircleCheck [size]="24"></svg> }
        @case ('error') { <svg lucideCircleX [size]="24"></svg> }
        @case ('advertencia') { <svg lucideTriangleAlert [size]="24"></svg> }
      }
    </div>

    <div class="toast-contenido">
      <strong>{{ a.titulo }}</strong>
      <span>{{ a.texto }}</span>
    </div>

    <button type="button" class="toast-cerrar" aria-label="Cerrar" (click)="cerrar(a.id)">
      <svg lucideX [size]="16"></svg>
    </button>
  </div>
  }
</div>
