<div class="toast-container-furni" aria-live="polite">
  @for (a of alertas(); track a.id) {
  <div class="toast-furni" [attr.data-tipo]="a.tipo"
    [class.toast-saliendo]="alertasCerrando().has(a.id)" role="alert">

    <div class="toast-icono">
      @switch (a.tipo) {
        @case ('exito') { <svg lucideCircleCheck [size]="24"></svg> }
        @case ('error') { <svg lucideCircleX [size]="24"></svg> }
        @case ('advertencia') { <svg lucideTriangleAlert [size]="24"></svg> }
      }
    </div>

    <div class="toast-contenido">
      <strong>{{ a.titulo }}</strong>
      <span>{{ a.texto }}</span>
    </div>

    <button type="button" class="toast-cerrar" aria-label="Cerrar" (click)="cerrar(a.id)">
      <svg lucideX [size]="16"></svg>
    </button>
  </div>
  }
</div>

@if (confirmacion(); as modal) {
  <div class="confirmacion-backdrop" (click)="responderConfirmacion(false)">
    <section class="confirmacion-modal" role="dialog" aria-modal="true"
      aria-labelledby="confirmacion-titulo" (click)="$event.stopPropagation()">
      <h2 id="confirmacion-titulo">{{ modal.titulo }}</h2>
      <p>{{ modal.texto }}</p>
      <div class="confirmacion-acciones">
        <button type="button" class="btn btn-outline-secondary"
          (click)="responderConfirmacion(false)">Cancelar</button>
        <button type="button" class="btn btn-primary"
          (click)="responderConfirmacion(true)">{{ modal.textoAceptar }}</button>
      </div>
    </section>
  </div>
}
