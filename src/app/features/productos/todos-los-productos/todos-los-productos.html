<h2>Productos</h2>

<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Marca</th>
      <th>Categoría</th>
      <th>Precio normal</th>
      <th>Precio clientes</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let producto of productos">
      <td>{{ producto.nombreProducto }}</td>
      <td>{{ producto.marca }}</td>
      <td>{{ producto.categoria }}</td>
      <td>${{ producto.precioNormal }}</td>
      <td>{{ producto.precioClientes ? '$' + producto.precioClientes : 'N/A' }}</td>
      <td>
        <button (click)="verDetalle(producto.id)">Ver detalle</button>
      </td>
    </tr>
  </tbody>
</table>
